[project]
name = "taxameter"
version = "0.1.0"
description = "Guard layer for rented GPU boxes: money caps, watchdog, host blocklist, push-run-fetch-destroy."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Pierre Kisters", email = "pierrekisters@gmail.com" }]
dependencies = ["httpx>=0.27"]

[project.scripts]
taxameter = "taxameter.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxameter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
